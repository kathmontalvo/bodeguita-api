services:
  postgres:
    image: postgres:17
    container_name: bodeguita-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - bodeguita-pgdata:/var/lib/postgresql/data

volumes:
  bodeguita-pgdata: